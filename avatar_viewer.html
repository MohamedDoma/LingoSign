<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #597395;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  canvas {
    display: block;
  }

  #avatar-loading {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #597395;
    color: white;
    transition: opacity 220ms ease, visibility 220ms ease;
  }

  #avatar-loading.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .avatar-loading-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0.95;
    text-align: center;
  }

  .avatar-spinner {
    width: 34px;
    height: 34px;
    border-radius: 999px;
    border: 4px solid rgba(255, 255, 255, 0.28);
    border-top-color: #ffffff;
    animation: spin 0.8s linear infinite;
  }

  .avatar-loading-text {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
</head>
<body>
  <div id="avatar-loading">
    <div class="avatar-loading-card">
      <div class="avatar-spinner"></div>
      <div class="avatar-loading-text">Loading 3D avatar…</div>
    </div>
  </div>

  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";

let scene, camera, renderer, mixer, model;
let actions = [];
let currentAction = null;
let animationSpeed = 1;

function hideAvatarLoading() {
  const loading = document.getElementById("avatar-loading");
  if (!loading) return;

  loading.classList.add("hidden");

  window.setTimeout(() => {
    loading.remove();
  }, 260);
}

init();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x597395);

      camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );

      camera.position.set(0, 1.1, 7);

      function isWebGLAvailable() {
  try {
    const canvas = document.createElement("canvas");
    return !!(
      window.WebGLRenderingContext &&
      (canvas.getContext("webgl") || canvas.getContext("experimental-webgl"))
    );
  } catch (e) {
    return false;
  }
}

if (!isWebGLAvailable()) {
  document.body.innerHTML = `
    <div style="
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      color:white;
      font-family:sans-serif;
      text-align:center;
      padding:20px;
    ">
      <h2>⚠️ 3D Avatar Not Supported</h2>
      <p>
        Your device or browser does not support 3D rendering.
      </p>
      <p style="opacity:0.7;">
        Please open using <b>Chrome (Android)</b> or <b>Safari (iPhone)</b>
      </p>
    </div>
  `;
  return;
}

renderer = new THREE.WebGLRenderer({
  antialias: false,
  alpha: true,
  powerPreference: "high-performance",
});

renderer.setSize(window.innerWidth, window.innerHeight);

// Cap pixel ratio for better mobile/web performance.
// High-DPI phones can otherwise render 2x–3x more pixels.
const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(pixelRatio);

document.body.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.8);
      directionalLight.position.set(2, 4, 5);
      scene.add(directionalLight);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enableZoom = false;
      controls.enablePan = false;
      controls.target.set(0, 1, 0);

      const loader = new GLTFLoader();

      loader.load(
        "assets/assets/avatar/asl.glb",
        function (gltf) {
          model = gltf.scene;
          model.scale.set(5, 5, 5);
            model.position.set(0, -5.6, 0);

          scene.add(model);

          mixer = new THREE.AnimationMixer(model);

          actions = gltf.animations.map((clip) => {
            const action = mixer.clipAction(clip);
            action.loop = THREE.LoopOnce;
            action.clampWhenFinished = true;
            return action;
        });

          playAnimation(10);
          hideAvatarLoading();
        },
        undefined,
        function (error) {
          console.error("GLB load error:", error);

          const loading = document.getElementById("avatar-loading");
          if (loading) {
            loading.innerHTML = `
              <div class="avatar-loading-card">
                <div style="font-size:28px;">⚠️</div>
                <div class="avatar-loading-text">Could not load 3D avatar</div>
              </div>
            `;
          }
        }
      );

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        controls.update();
        renderer.render(scene, camera);
      }

      animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
});

      window.addEventListener("message", (event) => {
  const data = event.data;

  if (!data) return;

  if (data.type === "PLAY_ANIMATION") {
    playAnimation(data.index);
  }

  if (data.type === "SET_SPEED") {
    animationSpeed = data.value || 1;
  }
});
    }

function playAnimation(index) {
  if (!actions[index]) {
    console.warn("Animation index not found:", index);
    return;
  }

  const nextAction = actions[index];

  // Stop the previous animation immediately.
  // No fade here, because fade can hide the first frames and cause glitches.
  if (currentAction && currentAction !== nextAction) {
    currentAction.stop();
  }

  // Replaying the same action must restart from frame 0.
  // This fixes repeated letters like "Alaa", "book", and "Heeeeey".
  nextAction.stop();
  nextAction.reset();
  nextAction.time = 0;
  nextAction.paused = false;
  nextAction.enabled = true;
  nextAction.loop = THREE.LoopOnce;
  nextAction.clampWhenFinished = true;
  nextAction.setEffectiveTimeScale(animationSpeed);
  nextAction.setEffectiveWeight(1);
  nextAction.play();

  currentAction = nextAction;
}
  </script>
</body>
</html>
