<!DOCTYPE html>
<html>
<head>
  <base href="/LingoSign/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="LingoSign helps bridge communication between Deaf, hard-of-hearing, and hearing users through sign, text, voice, and avatar-based tools."
  >

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LingoSign">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LingoSign</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7fbff;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(64, 196, 170, 0.18), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(70, 104, 255, 0.16), transparent 30%),
        linear-gradient(135deg, #ffffff 0%, #f7fbff 48%, #eef6ff 100%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #102a43;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #app-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      width: min(86vw, 360px);
      padding: 28px 24px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(28, 66, 120, 0.08);
      box-shadow: 0 24px 70px rgba(16, 42, 67, 0.12);
      text-align: center;
      backdrop-filter: blur(18px);
    }

    .splash-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #4668ff, #40c4aa);
      color: white;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      box-shadow: 0 16px 34px rgba(70, 104, 255, 0.26);
    }

    .splash-title {
      margin: 0;
      font-size: 25px;
      font-weight: 850;
      letter-spacing: -0.4px;
    }

    .splash-subtitle {
      margin: 8px 0 22px;
      color: rgba(16, 42, 67, 0.66);
      font-size: 14px;
      line-height: 1.45;
    }

    .splash-loader {
      width: 44px;
      height: 44px;
      margin: 0 auto;
      border-radius: 999px;
      border: 4px solid rgba(70, 104, 255, 0.12);
      border-top-color: #4668ff;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="app-splash" aria-label="Loading LingoSign">
    <div class="splash-card">
      <div class="splash-logo">LS</div>
      <h1 class="splash-title">LingoSign</h1>
      <p class="splash-subtitle">Preparing your accessible communication workspace…</p>
      <div class="splash-loader"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('app-splash');
      if (!splash) return;

      splash.classList.add('hidden');

      window.setTimeout(function () {
        splash.remove();
      }, 320);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
