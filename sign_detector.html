<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050816;
      font-family: Arial, sans-serif;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050816;
    }

#video,
#canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#video {
  display: none;
}

#canvas {
  z-index: 2;
  pointer-events: none;
}

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.32);
    }

    #overlay.hidden {
      display: none;
    }

    .hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.78);
      text-align: center;
      padding: 18px;
    }

    .hint-icon {
      width: 88px;
      height: 88px;
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      color: rgba(255, 255, 255, 0.45);
    }

    .hint-title {
      font-size: 14px;
      font-weight: 700;
    }

    .hint-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.48);
      max-width: 260px;
      line-height: 1.45;
    }

    #status {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.58);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    #error {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 5;
      display: none;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 82, 82, 0.14);
      color: #ffb4b4;
      border: 1px solid rgba(255, 82, 82, 0.32);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="root">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>

    <div id="status">Camera ready</div>

    <div id="overlay">
      <div class="hint">
        <div class="hint-icon">🤟</div>
        <div class="hint-title">Press start to begin sign tracking</div>
        <div class="hint-subtitle">
          Your hand skeleton will appear here when MediaPipe detects your hand.
        </div>
      </div>
    </div>

    <div id="error"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

<script type="module">
  import {
    FilesetResolver,
    HandLandmarker,
  } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs';
  const videoElement = document.getElementById('video');
  const canvasElement = document.getElementById('canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const overlay = document.getElementById('overlay');
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');

  let mediaStream = null;
  let animationFrameId = null;
  let isRunning = false;

  let handLandmarker = null;
  let isHandTrackerAvailable = true;
  let lastVideoTime = -1;

  let signModel = null;
  let signLabels = [];
  let predictionBuffer = [];
  let isPredicting = false;
  let lastPredictionLabel = null;
  let stablePredictionCount = 0;

  const FRAMES_PER_SAMPLE = 30;
  const FEATURES_PER_FRAME = 126;
  const CONFIDENCE_THRESHOLD = 0.75;
  const STABLE_PREDICTION_REQUIRED = 3;

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function showError(message) {
    errorEl.style.display = 'block';
    errorEl.textContent = message;
  }

  function hideError() {
    errorEl.style.display = 'none';
    errorEl.textContent = '';
  }

  function clearCanvas() {
  resizeCanvas();
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
  canvasCtx.fillStyle = '#050816';
  canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
}

function resetPredictionState() {
  predictionBuffer = [];
  isPredicting = false;
  lastPredictionLabel = null;
  stablePredictionCount = 0;
}

  function isWebGLAvailable() {
    try {
      const canvas = document.createElement('canvas');
      return !!(
        window.WebGLRenderingContext &&
        (canvas.getContext('webgl') ||
          canvas.getContext('experimental-webgl'))
      );
    } catch (_) {
      return false;
    }
  }

function resizeCanvas() {
  const rect = canvasElement.getBoundingClientRect();

  canvasElement.width = Math.max(1, Math.floor(rect.width));
  canvasElement.height = Math.max(1, Math.floor(rect.height));
}

function getVideoLayout(canvasWidth, canvasHeight, videoWidth, videoHeight) {
  // دايماً هنستخدم Math.min عشان الكاميرا تظهر كاملة (Contain) بدون أي زوم أو قص على أي شاشة
  const scale = Math.min(canvasWidth / videoWidth, canvasHeight / videoHeight);

  const drawWidth = videoWidth * scale;
  const drawHeight = videoHeight * scale;

  return {
    offsetX: (canvasWidth - drawWidth) / 2,
    offsetY: (canvasHeight - drawHeight) / 2,
    drawWidth,
    drawHeight,
  };
}

  async function initSignModel() {
    if (signModel) return;
    setStatus('Loading sign model...');
    try {
      // WebGL is not available on some devices/browsers.
      // Force CPU backend to avoid hanging when TFJS fails to initialize WebGL.
      await tf.setBackend('cpu');
      await tf.ready();

      signModel = await tf.loadLayersModel(
  'models/letters_space_v2/model.json'
);
      const labelsResponse = await fetch(
  'models/letters_space_v2/labels.json'
);
      const labelsData = await labelsResponse.json();
      signLabels = labelsData.labels || [];
      if (!signLabels.length) throw new Error('No labels found');
      setStatus('Sign model ready');
      console.log('✅ Sign model loaded', signLabels);
    } catch (e) {
      console.error('Sign model failed:', e);
      showError('AI Model failed to load');
    }
  }

  function normalizeHandsToFixedFrame(hands) {
    const frame = new Array(FEATURES_PER_FRAME).fill(0);
    if (!hands || !hands.length) return frame;
    for (let handIdx = 0; handIdx < hands.length && handIdx < 2; handIdx++) {
      const hand = hands[handIdx];
      const offset = handIdx * 63;
      for (let i = 0; i < hand.length && i < 21; i++) {
        const base = offset + i * 3;
        frame[base] = Number(hand[i].x || 0);
        frame[base + 1] = Number(hand[i].y || 0);
        frame[base + 2] = Number(hand[i].z || 0);
      }
    }
    return frame;
  }

async function runSignPrediction(hands) {
  if (!isRunning || !signModel || !signLabels.length || isPredicting) return;
    const frame = normalizeHandsToFixedFrame(hands);
    predictionBuffer.push(frame);
    if (predictionBuffer.length > FRAMES_PER_SAMPLE) predictionBuffer.shift();
    if (predictionBuffer.length < FRAMES_PER_SAMPLE) return;

    isPredicting = true;
    try {
      const input = tf.tensor3d([predictionBuffer], [1, FRAMES_PER_SAMPLE, FEATURES_PER_FRAME]);
      const output = signModel.predict(input);
      const probs = await output.data();
      if (!isRunning) {
  input.dispose();
  output.dispose();
  return;
}
      input.dispose(); output.dispose();

      let bestIdx = 0, bestConf = probs[0];
      for (let i = 1; i < probs.length; i++) {
        if (probs[i] > bestConf) { bestConf = probs[i]; bestIdx = i; }
      }

      const label = signLabels[bestIdx];
      if (!label || bestConf < CONFIDENCE_THRESHOLD) {
        stablePredictionCount = 0; lastPredictionLabel = null;
        return;
      }

      if (label === lastPredictionLabel) stablePredictionCount++;
      else { lastPredictionLabel = label; stablePredictionCount = 1; }

      setStatus(`Prediction: ${label} · ${(bestConf * 100).toFixed(0)}%`);

      if (stablePredictionCount >= STABLE_PREDICTION_REQUIRED) {
        window.parent.postMessage({ type: 'SIGN_PREDICTION', label, confidence: bestConf, timestamp: Date.now() }, '*');
        stablePredictionCount = 0; predictionBuffer = [];
      }
    } finally { isPredicting = false; }
  }

  const HAND_CONNECTIONS = [
    [0, 1], [1, 2], [2, 3], [3, 4],
    [0, 5], [5, 6], [6, 7], [7, 8],
    [5, 9], [9, 10], [10, 11], [11, 12],
    [9, 13], [13, 14], [14, 15], [15, 16],
    [13, 17], [17, 18], [18, 19], [19, 20],
    [0, 17],
  ];

  async function initHandLandmarker() {
    if (handLandmarker || !isHandTrackerAvailable) return;

    setStatus('Loading hand tracker...');

    if (!isWebGLAvailable()) {
      isHandTrackerAvailable = false;
      setStatus('3D/WebGL not available');
      showError(
        'Sign tracking is not supported in this browser because WebGL is disabled or unavailable. Camera preview can still open, but AI hand tracking cannot run here.'
      );
      return;
    }

    try {
      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm'
      );

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
          delegate: 'CPU',
        },
        runningMode: 'VIDEO',
        numHands: 2,
        minHandDetectionConfidence: 0.65,
        minHandPresenceConfidence: 0.65,
        minTrackingConfidence: 0.65,
      });
    } catch (error) {
      console.error('Hand tracker init failed:', error);
      handLandmarker = null;
      isHandTrackerAvailable = false;
      setStatus('Hand tracker unavailable');
      showError(
        `Hand tracker failed to start: ${error.message || error}`
      );
    }
  }

  function drawHandSkeleton(hands, layout) {
    if (!hands || hands.length === 0) return;

    const { offsetX, offsetY, drawWidth, drawHeight } = layout;

    for (const hand of hands) {
      for (const [start, end] of HAND_CONNECTIONS) {
        const p1 = hand[start];
        const p2 = hand[end];

        if (!p1 || !p2) continue;

        const x1 = offsetX + ((1 - p1.x) * drawWidth);
        const y1 = offsetY + (p1.y * drawHeight);

        const x2 = offsetX + ((1 - p2.x) * drawWidth);
        const y2 = offsetY + (p2.y * drawHeight);

        canvasCtx.beginPath();
        canvasCtx.moveTo(x1, y1);
        canvasCtx.lineTo(x2, y2);
        canvasCtx.strokeStyle = '#7C5CFF';
        canvasCtx.lineWidth = 4;
        canvasCtx.lineCap = 'round';
        canvasCtx.stroke();
      }

      for (const point of hand) {
        const x = offsetX + ((1 - point.x) * drawWidth);
        const y = offsetY + (point.y * drawHeight);

        canvasCtx.beginPath();
        canvasCtx.arc(x, y, 5, 0, Math.PI * 2);
        canvasCtx.fillStyle = '#20E3B2';
        canvasCtx.fill();

        canvasCtx.lineWidth = 2;
        canvasCtx.strokeStyle = '#ffffff';
        canvasCtx.stroke();
      }
    }
  }

  function drawVideoContain() {
    resizeCanvas();

    const canvasWidth = canvasElement.width;
    const canvasHeight = canvasElement.height;

    const videoWidth = videoElement.videoWidth || 1280;
    const videoHeight = videoElement.videoHeight || 720;

const {
  offsetX,
  offsetY,
  drawWidth,
  drawHeight,
} = getVideoLayout(canvasWidth, canvasHeight, videoWidth, videoHeight);

    canvasCtx.clearRect(0, 0, canvasWidth, canvasHeight);

    canvasCtx.fillStyle = '#050816';
    canvasCtx.fillRect(0, 0, canvasWidth, canvasHeight);

    canvasCtx.save();
    canvasCtx.translate(canvasWidth, 0);
    canvasCtx.scale(-1, 1);
    canvasCtx.drawImage(
      videoElement,
      canvasWidth - offsetX - drawWidth,
      offsetY,
      drawWidth,
      drawHeight,
    );
    canvasCtx.restore();

    const layout = {
      offsetX,
      offsetY,
      drawWidth,
      drawHeight,
    };

    if (
      isHandTrackerAvailable &&
      handLandmarker &&
      videoElement.readyState >= 2 &&
      videoElement.currentTime !== lastVideoTime
    ) {
      lastVideoTime = videoElement.currentTime;

      let results = null;

      try {
        results = handLandmarker.detectForVideo(
          videoElement,
          performance.now()
        );
      } catch (error) {
        console.error('Hand detection failed:', error);
        handLandmarker = null;
        isHandTrackerAvailable = false;
        setStatus('Hand tracker unavailable');
        showError(
          `Hand detection failed: ${error.message || error}`
        );
        if (isRunning) {
  animationFrameId = window.requestAnimationFrame(drawVideoContain);
}
        return;
      }

      const handsDetected = results.landmarks && results.landmarks.length > 0;

      if (handsDetected) {
        overlay.classList.add('hidden');

        setStatus(
          `Tracking ${results.landmarks.length} hand${results.landmarks.length > 1 ? 's' : ''}`
        );

        drawHandSkeleton(results.landmarks, layout);

        // إضافة سطر التوقع هنا
        runSignPrediction(results.landmarks);

        window.parent.postMessage(
          {
            type: 'SIGN_LANDMARKS',
            hands: results.landmarks,
            timestamp: Date.now(),
          },
          '*'
        );
      } else {
  overlay.classList.add('hidden');
  setStatus('Searching for hands');
}
    }

    if (isRunning) {
  animationFrameId = window.requestAnimationFrame(drawVideoContain);
}
  }

  async function startDetection() {
    try {
      hideError();

      if (isRunning) return;

      setStatus('Starting camera...');
overlay.classList.add('hidden');
clearCanvas();
resetPredictionState();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('getUserMedia is not available in this browser.');
      }

      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width: { ideal: 1280 },
          height: { ideal: 720 },
        },
        audio: false,
      });

      videoElement.srcObject = mediaStream;
      videoElement.muted = true;
      videoElement.playsInline = true;

      await videoElement.play();

isRunning = true;
lastVideoTime = -1;
overlay.classList.add('hidden');
setStatus('Camera running');

drawVideoContain();

      Promise.all([
        initHandLandmarker(),
        initSignModel(),
      ])
        .then(() => {
          if (isRunning) {
            setStatus('Searching for hands');
          }
        })
        .catch((error) => {
          console.error('Hand tracker failed:', error);

          if (isRunning) {
            setStatus('Camera running');
            showError(
              `Hand tracker failed, but camera is running: ${error.message || error}`
            );
          }
        });
    } catch (error) {
      console.error(error);

      isRunning = false;
      setStatus('Camera error');

      showError(
        `Camera failed: ${error.name || 'Error'} - ${error.message || error}`
      );
    }
  }

async function stopDetection() {
  isRunning = false;

  resetPredictionState();

  if (animationFrameId) {
    window.cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }

  if (mediaStream) {
    for (const track of mediaStream.getTracks()) {
      track.stop();
    }

    mediaStream = null;
  }

  videoElement.pause();
  videoElement.srcObject = null;
  lastVideoTime = -1;

  clearCanvas();

  overlay.classList.add('hidden');
  setStatus('Camera paused');
}

  window.addEventListener('resize', resizeCanvas);

  window.addEventListener('message', (event) => {
    const data = event.data || {};

    if (data.type === 'START_SIGN_DETECTION') {
      startDetection();
    }

    if (data.type === 'STOP_SIGN_DETECTION') {
      stopDetection();
    }
  });

  // مهم: للتجربة فقط، نخلي الكاميرا تبدأ بمجرد تحميل الـ iframe
  // بعد ما نتأكد إنها شغالة، نرجع نخليها تبدأ بزر Start فقط.
  window.addEventListener('load', () => {
    setStatus('Camera ready');
  });

  resizeCanvas();
  setStatus('Camera ready');
</script>
</body>
</html>
